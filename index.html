<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="异能原理学文库 · GitHub 驱动的在线阅读站">
<title>异能原理学文库</title>
<style>
:root{
  --bg:#f2f0eb;--paper:#fcfbf8;--paper2:#f7f5f0;--ink:#292824;--muted:#77736a;
  --line:#ddd9d0;--accent:#514d45;--soft:#e9e5dc;--shadow:0 16px 42px rgba(40,36,28,.07);
  --sidebar:286px;--reader:900px;--font:18px;--lh:1.95
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
button,input{font:inherit}button{cursor:pointer}
.topbar{position:fixed;z-index:30;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 22px;background:rgba(252,251,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:var(--sidebar);font-weight:700;letter-spacing:.08em}
.mark{width:30px;height:30px;border:1px solid var(--accent);display:grid;place-items:center;font-size:14px}
.brand small{display:block;font-size:9px;color:var(--muted);font-weight:400;letter-spacing:.18em;margin-top:2px}
.searchbox{position:relative;width:min(370px,42vw);margin-left:8px}
.searchbox input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper2);padding:0 14px 0 37px;outline:0;color:var(--ink)}
.searchbox input:focus{border-color:#aaa397;background:var(--paper)}
.search-icon{position:absolute;left:13px;top:8px;color:var(--muted);font:20px Arial}
.actions{margin-left:auto;display:flex;gap:7px}
.btn{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--accent)}
.btn:hover{background:var(--soft)}
.sidebar{position:fixed;z-index:20;left:0;top:64px;bottom:0;width:var(--sidebar);overflow:auto;background:var(--paper2);border-right:1px solid var(--line);padding:26px 18px 42px}
.side-title{font-size:10px;letter-spacing:.2em;color:var(--muted);margin:0 8px 13px}
.book-list{display:flex;flex-direction:column;gap:5px}
.book-item,.chapter-item{width:100%;text-align:left;border:0;border-radius:7px;background:transparent;color:var(--ink)}
.book-item{padding:9px 10px;font-weight:600;line-height:1.45}
.book-item:hover,.chapter-item:hover{background:var(--soft)}
.book-item.active{background:#dfdbd2}
.book-meta{font-size:10px;color:var(--muted);font-weight:400}
.chapter-list{margin:2px 0 10px 12px;padding-left:9px;border-left:1px solid var(--line)}
.chapter-item{padding:7px 9px;font-size:13px;color:#625e56}
.chapter-item.active{background:var(--soft);color:var(--ink);font-weight:700}
.side-note{margin-top:24px;padding:15px;border:1px dashed #c8c3b9;border-radius:8px;color:var(--muted);font-size:12px;line-height:1.8}
.side-note code,.reader code{font-family:"SFMono-Regular",Consolas,monospace}
.main{margin-left:var(--sidebar);padding-top:64px;min-height:100vh}
.hero,.cards,.reader-shell{width:min(var(--reader),100%);margin:auto}
.hero{padding:76px 38px 34px}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-bottom:15px}
.hero h1{font-size:clamp(34px,5vw,57px);line-height:1.22;font-weight:600;margin:0 0 16px}
.hero p{max-width:700px;margin:0;color:var(--muted);font-size:15px;line-height:1.9}
.stats{display:flex;gap:28px;border-top:1px solid var(--line);margin-top:30px;padding-top:18px}
.stat strong{font-size:23px;font-weight:600}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.cards{padding:0 38px 80px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:23px;box-shadow:var(--shadow);transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:0 20px 48px rgba(40,36,28,.1)}
.card h2{font-size:21px;font-weight:600;margin:0 0 9px}
.card p{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 16px}
.open{border:1px solid var(--line);border-radius:6px;background:var(--paper2);padding:8px 12px;color:var(--ink);font-size:12px}
.reader-shell{padding:34px 38px 90px}
.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:17px}
.reader{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:clamp(30px,5vw,68px)}
.reader h1,.reader h2,.reader h3,.reader h4{font-weight:600;line-height:1.45}
.reader h1{font-size:34px;margin:0 0 27px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.reader h2{font-size:25px;margin:45px 0 15px}
.reader h3{font-size:21px;margin:34px 0 12px}
.reader h4{font-size:18px;margin:28px 0 10px}
.reader p,.reader li{font-size:var(--font);line-height:var(--lh);letter-spacing:.012em}
.reader p{margin:0 0 1.15em}
.reader ul,.reader ol{padding-left:1.65em}.reader li{margin:.28em 0}
.reader blockquote{margin:1.5em 0;padding:8px 20px;border-left:3px solid #aaa397;background:var(--paper2);color:#6a665e}
.reader code{font-size:.84em;background:#ece9e2;padding:2px 5px;border-radius:4px}
.reader pre{background:#292826;color:#eeeae2;overflow:auto;padding:18px;border-radius:7px;line-height:1.65}
.reader pre code{background:none;padding:0;color:inherit}
.reader a{color:#514d45;text-decoration:underline;text-underline-offset:3px}
.reader hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.reader img{display:block;max-width:100%;height:auto;margin:22px auto;border-radius:5px}
.reader table{width:100%;border-collapse:collapse;margin:22px 0;font-size:.92em}
.reader th,.reader td{border:1px solid var(--line);padding:9px 11px;text-align:left}
.reader th{background:var(--paper2)}
.chapter-nav{display:flex;gap:14px;margin-top:18px}
.nav-btn{flex:1;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:13px 15px;color:var(--ink)}
.nav-btn:last-child{text-align:right}.nav-btn:hover{background:var(--soft)}
.nav-btn small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.loading,.error{text-align:center;padding:44px;color:var(--muted);line-height:1.8}
.error{color:#865c52}
.hidden{display:none!important}
.search-results{display:none;position:fixed;z-index:45;top:64px;right:22px;width:min(500px,calc(100vw - 44px));max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:0 0 10px 10px;box-shadow:var(--shadow)}
.search-results.show{display:block}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 16px;color:var(--ink)}
.result:hover{background:var(--paper2)}.result b{font-size:13px}.result small{display:block;color:var(--muted);margin-top:3px}
.no-results{padding:22px;color:var(--muted);font-size:13px}
.progress{position:fixed;z-index:60;top:0;left:0;height:2px;background:#514d45;width:0}
.overlay{display:none}
@media(max-width:800px){
  .topbar{height:58px;padding:0 12px}.brand{min-width:auto}.brand-text{display:none}
  .searchbox{width:min(250px,55vw)}.actions{gap:4px}
  .sidebar{top:58px;transform:translateX(-101%);transition:.22s;box-shadow:10px 0 30px rgba(0,0,0,.08)}
  .sidebar.open{transform:translateX(0)}
  .overlay{position:fixed;z-index:19;inset:58px 0 0;background:rgba(0,0,0,.18)}
  .overlay.show{display:block}.main{margin-left:0;padding-top:58px}
  .hero{padding:48px 22px 28px}.cards{padding:0 22px 60px;grid-template-columns:1fr}
  .reader-shell{padding:25px 14px 65px}.reader{padding:30px 23px}
  .reader h1{font-size:28px}.reader p,.reader li{font-size:17px}
}
@media(max-width:470px){
  .searchbox{width:145px}.desktop-only{display:none}.hero h1{font-size:35px}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="topbar">
  <button class="btn" id="menuBtn" aria-label="目录">☰</button>
  <div class="brand">
    <div class="mark">原</div>
    <div class="brand-text">异能原理学 <small>DIGITAL LIBRARY</small></div>
  </div>
  <div class="searchbox">
    <span class="search-icon">⌕</span>
    <input id="search" type="search" placeholder="搜索书籍或章节…" autocomplete="off">
  </div>
  <div class="actions">
    <button class="btn desktop-only" id="fontMinus" title="减小字号">A−</button>
    <button class="btn desktop-only" id="fontPlus" title="增大字号">A＋</button>
    <button class="btn" id="themeBtn" title="深色阅读">◐</button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="side-title">书库目录</div>
  <div id="bookList" class="book-list"><div class="loading">正在读取书库…</div></div>
  <div class="side-note">
    <b>添加新书</b><br>
    在 GitHub 的 <code>books/</code> 中新建一个文件夹，把每一章保存为 <code>.md</code> 文件。Vercel 部署后会自动显示。
  </div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <section id="homeView">
    <div class="hero">
      <div class="eyebrow">DIGITAL LIBRARY · ONLINE READER</div>
      <h1>异能原理学文库</h1>
      <p>以 GitHub 为书库、Vercel 为出版平台的个人数字文库。浏览目录、搜索章节，并直接进入在线阅读。</p>
      <div class="stats">
        <div class="stat"><strong id="bookCount">—</strong><span>本书</span></div>
        <div class="stat"><strong id="chapterCount">—</strong><span>个章节</span></div>
      </div>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <section id="readerView" class="reader-shell hidden">
    <div class="breadcrumb" id="breadcrumb"></div>
    <article class="reader" id="reader"><div class="loading">正在打开章节…</div></article>
    <div class="chapter-nav" id="chapterNav"></div>
  </section>
</main>

<div class="search-results" id="searchResults"></div>

<script>
"use strict";

const CONFIG={
  owner:"zakukana",
  repo:"yynylx-docs",
  branch:"main",
  booksDir:"books"
};

const state={
  books:[],
  currentBook:null,
  currentChapter:null,
  cache:new Map(),
  fontSize:Number(localStorage.getItem("reader-font-size"))||18
};

const $=s=>document.querySelector(s);
const bookList=$("#bookList"),cards=$("#cards"),reader=$("#reader"),
      readerView=$("#readerView"),homeView=$("#homeView"),
      chapterNav=$("#chapterNav"),search=$("#search"),searchResults=$("#searchResults");

function apiUrl(path=""){
  return "https://api.github.com/repos/"+CONFIG.owner+"/"+CONFIG.repo+"/contents/"+path+
    "?ref="+encodeURIComponent(CONFIG.branch);
}
function rawUrl(path){
  return "https://raw.githubusercontent.com/"+CONFIG.owner+"/"+CONFIG.repo+"/"+CONFIG.branch+"/"+
    path.split("/").map(encodeURIComponent).join("/");
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fileName(path){return path.split("/").pop().replace(/\.md$/i,"")}

async function github(path){
  const r=await fetch(apiUrl(path),{headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error("GitHub API "+r.status);
  return r.json();
}

async function scanBooks(){
  try{
    const root=await github(CONFIG.booksDir);
    const dirs=Array.isArray(root)?root.filter(x=>x.type==="dir"):[];
    const books=[];
    for(const dir of dirs){
      let items=[];
      try{items=await github(dir.path)}catch(e){continue}
      const chapters=items.filter(x=>x.type==="file"&&/\.md$/i.test(x.name))
        .sort((a,b)=>a.name.localeCompare(b.name,"zh-CN",{numeric:true}))
        .map((x,i)=>({name:fileName(x.name),path:x.path,index:i}));
      if(chapters.length)books.push({name:dir.name,path:dir.path,chapters});
    }
    state.books=books;
    renderSidebar();renderCards();
    $("#bookCount").textContent=books.length;
    $("#chapterCount").textContent=books.reduce((n,b)=>n+b.chapters.length,0);
    loadHash();
  }catch(e){
    bookList.innerHTML='<div class="error">暂时无法读取书库。<br>请确认仓库公开，并存在 <code>books/</code> 目录。</div>';
    cards.innerHTML='<div class="error" style="grid-column:1/-1">读取 GitHub 目录失败：'+esc(e.message)+'</div>';
  }
}

function renderSidebar(){
  if(!state.books.length){
    bookList.innerHTML='<div class="loading">书库暂为空。<br>请在 GitHub → <code>books/</code> 下添加书籍。</div>';
    return;
  }
  bookList.innerHTML=state.books.map((b,bi)=>`
    <div>
      <button class="book-item ${state.currentBook===bi?"active":""}" data-book="${bi}">
        ${esc(b.name)}<div class="book-meta">${b.chapters.length} 个章节</div>
      </button>
      <div class="chapter-list">
        ${b.chapters.map((c,ci)=>`
          <button class="chapter-item ${state.currentBook===bi&&state.currentChapter===ci?"active":""}"
            data-book="${bi}" data-chapter="${ci}">${esc(c.name)}</button>`).join("")}
      </div>
    </div>`).join("");
  bookList.querySelectorAll(".book-item").forEach(x=>x.onclick=()=>openBook(+x.dataset.book));
  bookList.querySelectorAll(".chapter-item").forEach(x=>x.onclick=()=>openChapter(+x.dataset.book,+x.dataset.chapter));
}

function renderCards(){
  if(!state.books.length){cards.innerHTML="";return}
  cards.innerHTML=state.books.map((b,i)=>`
    <div class="card">
      <div class="eyebrow">BOOK ${String(i+1).padStart(2,"0")}</div>
      <h2>${esc(b.name)}</h2>
      <p>${b.chapters.length} 个章节 · Markdown 在线阅读</p>
      <button class="open" data-open="${i}">进入阅读 →</button>
    </div>`).join("");
  cards.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openBook(+x.dataset.open));
}

function openBook(bi){
  if(!state.books[bi])return;
  state.currentBook=bi;state.currentChapter=null;
  homeView.classList.remove("hidden");readerView.classList.add("hidden");
  renderSidebar();document.title=state.books[bi].name+" · 异能原理学文库";closeMobile();
}

async function openChapter(bi,ci,setHash=true){
  const b=state.books[bi],c=b&&b.chapters[ci];if(!c)return;
  state.currentBook=bi;state.currentChapter=ci;
  homeView.classList.add("hidden");readerView.classList.remove("hidden");
  $("#breadcrumb").textContent=b.name+"  /  "+c.name;
  reader.innerHTML='<div class="loading">正在加载《'+esc(c.name)+'》…</div>';
  renderSidebar();closeMobile();
  if(setHash)location.hash="book="+encodeURIComponent(b.path)+"&chapter="+encodeURIComponent(c.path);
  try{
    let md=state.cache.get(c.path);
    if(!md){
      const r=await fetch(rawUrl(c.path));
      if(!r.ok)throw new Error("章节读取失败（"+r.status+"）");
      md=await r.text();state.cache.set(c.path,md);
    }
    reader.innerHTML=markdown(md);
    renderNav();document.title=c.name+" · "+b.name;
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    reader.innerHTML='<div class="error">无法读取本章节。<br>'+esc(e.message)+'</div>';
  }
}

function renderNav(){
  const b=state.books[state.currentBook],i=state.currentChapter;
  const p=b.chapters[i-1],n=b.chapters[i+1];
  chapterNav.innerHTML=(p?'<button class="nav-btn" id="prev"><small>上一章</small>'+esc(p.name)+'</button>':'<div></div>')+
    (n?'<button class="nav-btn" id="next"><small>下一章</small>'+esc(n.name)+'</button>':'<div></div>');
  if(p)$("#prev").onclick=()=>openChapter(state.currentBook,i-1);
  if(n)$("#next").onclick=()=>openChapter(state.currentBook,i+1);
}

function safeUrl(u){
  try{
    const x=new URL(u,location.href);
    if(["javascript:","data:","vbscript:"].includes(x.protocol))return "#";
    return esc(x.href);
  }catch{return "#"}
}
function inline(s){
  let x=esc(s);
  x=x.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(m,a,u,t)=>'<img src="'+safeUrl(u)+'" alt="'+a+'"'+(t?' title="'+t+'"':'')+'>');
  x=x.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,u)=>'<a href="'+safeUrl(u)+'" target="_blank" rel="noopener">'+a+"</a>");
  x=x.replace(/`([^`]+)`/g,"<code>$1</code>");
  x=x.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  x=x.replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/_([^_]+)_/g,"<em>$1</em>");
  return x;
}

function markdown(md){
  md=md.replace(/\r\n?/g,"\n");
  const l=md.split("\n"),o=[];let i=0,code=false,buf=[];
  while(i<l.length){
    const line=l[i];
    if(/^```/.test(line)){
      if(!code){code=true;buf=[]}else{o.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");code=false}
      i++;continue;
    }
    if(code){buf.push(line);i++;continue}
    if(!line.trim()){i++;continue}
    if(/^---+\s*$/.test(line)){o.push("<hr>");i++;continue}
    let m=line.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);
    if(m){o.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">");i++;continue}
    if(/^>\s?/.test(line)){
      const q=[];while(i<l.length&&/^>\s?/.test(l[i])){q.push(l[i].replace(/^>\s?/,""));i++}
      o.push("<blockquote>"+q.map(inline).join("<br>")+"</blockquote>");continue;
    }
    if(/^\s*[-*+]\s+/.test(line)){
      const a=[];while(i<l.length&&/^\s*[-*+]\s+/.test(l[i])){a.push(l[i].replace(/^\s*[-*+]\s+/,""));i++}
      o.push("<ul>"+a.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      const a=[];while(i<l.length&&/^\s*\d+[.)]\s+/.test(l[i])){a.push(l[i].replace(/^\s*\d+[.)]\s+/,""));i++}
      o.push("<ol>"+a.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");continue;
    }
    if(line.includes("|")&&i+1<l.length&&/^\s*\|?\s*:?-{2,}/.test(l[i+1])){
      const cells=s=>s.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
      const head=cells(line);i+=2;const rows=[];
      while(i<l.length&&l[i].includes("|")){rows.push(cells(l[i]));i++}
      o.push("<table><thead><tr>"+head.map(x=>"<th>"+inline(x)+"</th>").join("")+
        "</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+inline(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      continue;
    }
    const p=[line.trim()];i++;
    while(i<l.length&&l[i].trim()&&!/^(#{1,4})\s|^>\s?|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^```|^---+\s*$/.test(l[i])){
      p.push(l[i].trim());i++;
    }
    o.push("<p>"+inline(p.join("\n").replace(/\n/g,"<br>"))+"</p>");
  }
  return o.join("");
}

function loadHash(){
  if(!location.hash.startsWith("#book="))return;
  const p=new URLSearchParams(location.hash.slice(1));
  const bi=state.books.findIndex(b=>b.path===p.get("book"));
  if(bi<0)return;
  const ci=state.books[bi].chapters.findIndex(c=>c.path===p.get("chapter"));
  if(ci>=0)openChapter(bi,ci,false);
}

async function doSearch(q){
  q=q.trim().toLowerCase();
  if(!q){searchResults.classList.remove("show");return}
  const rs=[];
  state.books.forEach((b,bi)=>{
    if(b.name.toLowerCase().includes(q))rs.push({bi,ci:null,title:b.name,sub:"整本书 · "+b.chapters.length+" 个章节"});
    b.chapters.forEach((c,ci)=>{
      if(c.name.toLowerCase().includes(q)&&rs.length<30)rs.push({bi,ci,title:c.name,sub:b.name});
    });
  });
  searchResults.innerHTML=rs.length?rs.map((r,i)=>'<button class="result" data-r="'+i+'"><b>'+esc(r.title)+'</b><small>'+esc(r.sub)+'</small></button>').join(""):
    '<div class="no-results">没有找到匹配的书籍或章节</div>';
  searchResults.classList.add("show");
  searchResults.querySelectorAll("[data-r]").forEach((x,i)=>x.onclick=()=>{
    const r=rs[i];r.ci===null?openBook(r.bi):openChapter(r.bi,r.ci);
    search.value="";searchResults.classList.remove("show");
  });
}

function closeMobile(){$("#sidebar").classList.remove("open");$("#overlay").classList.remove("show")}
$("#menuBtn").onclick=()=>{$("#sidebar").classList.toggle("open");$("#overlay").classList.toggle("show")};
$("#overlay").onclick=closeMobile;
$("#fontMinus").onclick=()=>{state.fontSize=Math.max(15,state.fontSize-1);document.documentElement.style.setProperty("--font",state.fontSize+"px");localStorage.setItem("reader-font-size",state.fontSize)};
$("#fontPlus").onclick=()=>{state.fontSize=Math.min(24,state.fontSize+1);document.documentElement.style.setProperty("--font",state.fontSize+"px");localStorage.setItem("reader-font-size",state.fontSize)};
document.documentElement.style.setProperty("--font",state.fontSize+"px");

$("#themeBtn").onclick=()=>{
  const dark=document.body.dataset.dark!=="1";
  document.body.dataset.dark=dark?"1":"";
  const root=document.documentElement;
  if(dark){
    root.style.setProperty("--bg","#20201e");root.style.setProperty("--paper","#292825");
    root.style.setProperty("--paper2","#242321");root.style.setProperty("--ink","#e8e4db");
    root.style.setProperty("--muted","#aaa59b");root.style.setProperty("--line","#45423c");
    root.style.setProperty("--soft","#37352f");
  }else location.reload();
};
search.addEventListener("input",()=>doSearch(search.value));
document.addEventListener("click",e=>{if(!e.target.closest(".searchbox")&&!e.target.closest(".search-results"))searchResults.classList.remove("show")});
window.addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;$("#progress").style.width=(h>0?scrollY/h*100:0)+"%"});
window.addEventListener("hashchange",loadHash);

scanBooks();
</script>
</body>
</html>
