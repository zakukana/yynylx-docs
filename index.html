<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="异能原理学文库 · GitHub 驱动的在线阅读站">
<meta name="color-scheme" content="light dark">
<title>异能原理学文库</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#f3f0e9; --paper:#fdfcf8; --paper-2:#f7f4ed;
  --ink:#25221d; --ink-2:#5b564d; --muted:#8d877a;
  --line:#e3ddd1; --line-2:#d3ccbd;
  --accent:#8c5b3f; --accent-ink:#75492f; --accent-soft:#f0e6dc;
  --soft:#ebe7dc; --mark:#f6e8c9;
  --code-bg:#2d2a24; --code-ink:#f1ebdc;
  --shadow-sm:0 1px 2px rgba(38,34,26,.05),0 4px 16px rgba(38,34,26,.05);
  --shadow-md:0 4px 14px rgba(38,34,26,.06),0 20px 55px rgba(38,34,26,.09);
  --radius:14px; --radius-sm:9px;
  --sidebar:302px; --reader:880px;
  --font-size:18px; --line-height:2.02;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
[data-theme="dark"]{
  --bg:#171613; --paper:#201e1a; --paper-2:#1b1a17;
  --ink:#e9e3d7; --ink-2:#c4bcac; --muted:#948c7c;
  --line:#37332c; --line-2:#474237;
  --accent:#cf9468; --accent-ink:#e0ad82; --accent-soft:#33291f;
  --soft:#2a2823; --mark:#4a3d22;
  --code-bg:#131209; --code-ink:#e8e0c9;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.4),0 20px 55px rgba(0,0,0,.35);
}
/* ============ 基础 ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input{font:inherit}button{cursor:pointer;color:inherit}
::selection{background:var(--accent);color:var(--paper)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶部栏 ============ */
.topbar{position:fixed;z-index:50;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;min-width:var(--sidebar);text-decoration:none;color:inherit;padding-right:6px}
.mark{width:34px;height:34px;flex:none;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:16px;font-weight:700;border-radius:7px;background:var(--accent-soft);transition:transform .25s}
.brand:hover .mark{transform:rotate(-6deg)}
.brand-text{font-weight:700;letter-spacing:.1em;font-size:15px;line-height:1.2}
.brand-text small{display:block;font-family:var(--sans);font-size:8.5px;font-weight:500;color:var(--muted);letter-spacing:.26em;margin-top:2px}
.searchbox{position:relative;width:min(400px,40vw);margin-left:6px}
.searchbox input{width:100%;height:37px;border:1px solid var(--line);border-radius:99px;background:var(--paper-2);padding:0 42px 0 36px;outline:0;color:var(--ink);font-family:var(--sans);font-size:13px;transition:border-color .2s,box-shadow .2s,background .2s}
.searchbox input:focus{border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.searchbox input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:13px;top:8.5px;color:var(--muted);font-size:15px;pointer-events:none}
.search-kbd{position:absolute;right:11px;top:9px;font-family:var(--sans);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1.5px 6px;background:var(--paper);pointer-events:none}
.actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{height:34px;min-width:34px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:12.5px;transition:background .18s,color .18s}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;fill:currentColor}
.progress{position:fixed;z-index:80;top:0;left:0;height:2.5px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-ink));border-radius:0 3px 3px 0;transition:width .12s linear}

/* ============ 侧边目录 ============ */
.sidebar{position:fixed;z-index:40;left:0;top:60px;bottom:0;width:var(--sidebar);overflow-y:auto;background:var(--paper-2);border-right:1px solid var(--line);padding:26px 16px 90px;scrollbar-width:thin}
.side-title{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.24em;color:var(--muted);margin:0 10px 14px;display:flex;align-items:center;gap:8px}
.side-title::after{content:"";flex:1;height:1px;background:var(--line)}
.book-block{margin-bottom:4px}
.book-item{width:100%;text-align:left;border:0;border-radius:var(--radius-sm);background:transparent;padding:9px 10px;font-weight:700;font-size:14.5px;line-height:1.5;color:var(--ink);display:flex;align-items:baseline;justify-content:space-between;gap:8px;transition:background .15s}
.book-item:hover{background:var(--soft)}
.book-item.active{background:var(--accent-soft);color:var(--accent-ink)}
.book-count{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--muted);flex:none}
.chapter-list{margin:1px 0 10px 10px;padding:2px 0 2px 12px;border-left:1px solid var(--line)}
.chapter-item{position:relative;width:100%;text-align:left;border:0;border-radius:7px;background:transparent;padding:6.5px 9px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.5;transition:background .15s,color .15s}
.chapter-item:hover{background:var(--soft);color:var(--ink)}
.chapter-item.active{background:var(--soft);color:var(--accent-ink);font-weight:700}
.chapter-item.active::before{content:"";position:absolute;left:-13px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--accent)}
.side-note{margin-top:26px;padding:15px 16px;border:1px dashed var(--line-2);border-radius:var(--radius-sm);color:var(--muted);font-family:var(--sans);font-size:11.5px;line-height:1.85}
.side-note b{color:var(--ink-2);font-size:12px}
.side-note code{font-family:var(--mono);font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:4px}

/* ============ 主区域 ============ */
.main{margin-left:var(--sidebar);padding-top:60px;min-height:100vh}
.hero,.cards,.reader-shell{width:min(var(--reader),100%);margin:auto}
.hero{position:relative;padding:88px 40px 40px;overflow:hidden}
.eyebrow{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.26em;color:var(--accent);margin-bottom:18px}
.hero h1{font-size:clamp(36px,5.2vw,60px);line-height:1.2;font-weight:700;margin:0 0 18px;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-desc{max-width:640px;margin:0;color:var(--muted);font-size:15px;line-height:2}
.hero-deco{position:absolute;top:60px;right:34px;bottom:40px;display:flex;align-items:flex-start;gap:22px;pointer-events:none;user-select:none}
.deco-seal{width:92px;height:92px;border:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:12px;display:grid;place-items:center;font-size:46px;font-weight:700;color:color-mix(in srgb,var(--accent) 30%,transparent);transform:rotate(4deg)}
.deco-vertical{writing-mode:vertical-rl;font-size:13px;letter-spacing:.5em;color:var(--line-2);font-weight:600}
.stats{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:36px}
.stat{padding:18px 34px 18px 0;margin-right:34px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat strong{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.12em}
/* 继续阅读 */
.continue{margin-top:26px}
.continue-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);background:var(--paper);padding:14px 18px;box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s}
.continue-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.continue-tag{flex:none;font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:4px 11px}
.continue-main{flex:1;min-width:0}
.continue-title{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-book{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:2px}
.continue-arrow{flex:none;color:var(--accent);font-size:18px}

/* ============ 书籍卡片 ============ */
.cards{padding:14px 40px 100px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 20px;box-shadow:var(--shadow-sm);transition:transform .22s,box-shadow .22s,border-color .22s;display:flex;flex-direction:column;animation:rise .5s ease both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--line-2)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-no{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.22em;color:var(--muted)}
.card-badge{font-family:var(--sans);font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);padding:3.5px 10px;border-radius:99px}
.card h2{font-size:21px;font-weight:700;margin:0 0 14px;line-height:1.4}
.card-preview{margin:0 0 18px;padding:0;list-style:none;flex:1}
.card-preview li{position:relative;font-family:var(--sans);font-size:12px;color:var(--muted);padding:5px 0 5px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dashed var(--line)}
.card-preview li:last-child{border-bottom:0}
.card-preview li::before{content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:99px;background:var(--line-2)}
.card-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px}
.card-meta{font-family:var(--sans);font-size:11px;color:var(--muted)}
.open-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:99px;background:transparent;padding:8px 16px;color:var(--accent-ink);font-family:var(--sans);font-size:12px;font-weight:600;transition:background .18s,border-color .18s}
.open-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.skeleton{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:26px;height:210px;position:relative;overflow:hidden}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--ink) 5%,transparent) 50%,transparent 70%);animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ============ 阅读器 ============ */
.reader-shell{padding:40px 40px 100px;animation:rise .35s ease both}
.breadcrumb{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.breadcrumb a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;cursor:pointer}
.breadcrumb a:hover{color:var(--accent-ink);border-color:var(--accent-ink)}
.breadcrumb .sep{color:var(--line-2)}
.reader{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:clamp(34px,5.5vw,74px)}
.reader-header{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:34px}
.reader h1{font-size:clamp(27px,3.4vw,36px);margin:0 0 12px;line-height:1.35;font-weight:700}
.reader-meta{display:flex;align-items:center;gap:16px;font-family:var(--sans);font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.reader-meta .dot{width:3px;height:3px;border-radius:99px;background:var(--line-2)}
.reader h2,.reader h3,.reader h4{font-weight:700;line-height:1.5;scroll-margin-top:80px}
.reader h2{font-size:24px;margin:52px 0 16px;padding-top:14px}
.reader h3{font-size:20px;margin:38px 0 12px}
.reader h4{font-size:17.5px;margin:30px 0 10px}
.reader p,.reader li{font-size:var(--font-size);line-height:var(--line-height);letter-spacing:.012em;color:var(--ink)}
.reader p{margin:0 0 1.2em}
.reader ul,.reader ol{padding-left:1.7em;margin:0 0 1.2em}
.reader li{margin:.3em 0}
.reader li::marker{color:var(--accent)}
.reader blockquote{margin:1.6em 0;padding:14px 22px;border-left:3px solid var(--accent);background:var(--paper-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--ink-2)}
.reader code{font-family:var(--mono);font-size:.83em;background:var(--soft);color:var(--accent-ink);padding:2px 6px;border-radius:5px}
.reader pre{position:relative;background:var(--code-bg);color:var(--code-ink);overflow:auto;padding:20px;border-radius:10px;line-height:1.7;margin:1.5em 0;border:1px solid color-mix(in srgb,var(--code-ink) 8%,transparent)}
.reader pre code{background:none;padding:0;color:inherit;font-size:.85em}
.copy-btn{position:absolute;top:9px;right:9px;font-family:var(--sans);font-size:10.5px;color:var(--code-ink);background:color-mix(in srgb,var(--code-ink) 12%,transparent);border:0;border-radius:6px;padding:4px 10px;opacity:0;transition:opacity .18s}
.reader pre:hover .copy-btn,.copy-btn:focus{opacity:1}
.reader a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.reader a:hover{text-decoration-color:var(--accent-ink)}
.reader hr{border:0;border-top:1px solid var(--line);margin:2.6em 0}
.reader img{display:block;max-width:100%;height:auto;margin:24px auto;border-radius:8px;border:1px solid var(--line)}
.reader table{width:100%;border-collapse:collapse;margin:24px 0;font-size:.9em;background:var(--paper)}
.reader th,.reader td{border:1px solid var(--line);padding:10px 13px;text-align:left;line-height:1.7}
.reader th{background:var(--paper-2);font-family:var(--sans);font-size:.88em;font-weight:600}
.reader del{opacity:.6}
/* 章内目录 */
.toc{margin:0 0 34px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-2);padding:16px 20px}
.toc-title{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
.toc a{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-2);text-decoration:none;padding:5.5px 0 5.5px 16px;position:relative;border-radius:6px;cursor:pointer;transition:color .15s,background .15s}
.toc a::before{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:99px;background:var(--line-2);transition:background .15s}
.toc a:hover{color:var(--accent-ink);background:var(--soft)}
.toc a:hover::before{background:var(--accent)}
/* 章节导航 */
.chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.nav-btn{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);padding:15px 18px;color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s,border-color .18s}
.nav-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-2)}
.nav-btn.next{text-align:right}
.nav-btn small{display:flex;align-items:center;gap:5px;font-family:var(--sans);font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.1em}
.nav-btn.next small{justify-content:flex-end}
.nav-btn .nav-name{font-weight:700;font-size:14.5px}
/* 状态块 */
.loading,.error{text-align:center;padding:52px 20px;color:var(--muted);line-height:2;font-family:var(--sans);font-size:13px}
.error{color:#a3543f}
.error code{font-family:var(--mono);background:var(--soft);padding:2px 6px;border-radius:5px;font-size:.9em}
.retry-btn{margin-top:14px;border:1px solid var(--line-2);background:var(--paper);border-radius:99px;padding:8px 22px;font-family:var(--sans);font-size:12px;color:var(--accent-ink)}
.retry-btn:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.reader .loading,.reader .error{font-family:var(--serif);font-size:14px}

/* ============ 搜索结果 ============ */
.search-results{display:none;position:fixed;z-index:70;top:66px;left:calc(var(--sidebar) + (100vw - var(--sidebar) - min(var(--reader),100vw - var(--sidebar))) / 2);width:min(480px,calc(100vw - var(--sidebar) - 60px));max-height:66vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md)}
.search-results.show{display:block;animation:rise .18s ease both}
.result{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px;color:var(--ink)}
.result:last-of-type{border-bottom:0}
.result:hover,.result.sel{background:var(--paper-2)}
.result b{font-size:13.5px;font-weight:600}
.result .r-sub{flex:1;text-align:right;font-family:var(--sans);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .r-kind{flex:none;font-family:var(--sans);font-size:9.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:2px 6px}
.no-results{padding:24px;color:var(--muted);font-family:var(--sans);font-size:12.5px;text-align:center}

/* ============ 返回顶部 ============ */
#toTop{position:fixed;z-index:45;right:26px;bottom:26px;width:42px;height:42px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);box-shadow:var(--shadow-md);display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s,background .2s,color .2s}
#toTop.show{opacity:1;pointer-events:auto;transform:none}
#toTop:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
#toTop svg{width:16px;height:16px;fill:currentColor}
.overlay{display:none}

/* ============ 响应式 ============ */
@media(max-width:900px){
  .hero-deco{display:none}
}
@media(max-width:820px){
  .topbar{height:56px;padding:0 12px;gap:9px}
  .brand{min-width:auto}.brand-text{display:none}
  .searchbox{width:min(230px,52vw);margin-left:0}
  .search-kbd{display:none}
  .sidebar{top:56px;transform:translateX(-102%);transition:transform .25s ease;box-shadow:14px 0 44px rgba(0,0,0,.12);z-index:60}
  .sidebar.open{transform:translateX(0)}
  .overlay{position:fixed;z-index:55;inset:56px 0 0;background:rgba(20,18,14,.28);backdrop-filter:blur(2px)}
  .overlay.show{display:block}
  .main{margin-left:0;padding-top:56px}
  .hero{padding:52px 22px 32px}
  .stats{flex-wrap:wrap}
  .stat{padding:14px 24px 14px 0;margin-right:24px}
  .cards{padding:10px 22px 70px;grid-template-columns:1fr}
  .reader-shell{padding:26px 14px 70px}
  .reader{padding:30px 22px;border-radius:12px}
  .reader h1{font-size:26px}
  .reader p,.reader li{font-size:17px}
  .chapter-nav{grid-template-columns:1fr}
  .search-results{left:12px;right:12px;width:auto;top:62px}
  #toTop{right:16px;bottom:16px}
}
@media(max-width:470px){
  .searchbox{width:150px}
  .desktop-only{display:none}
}
/* ============ 打印 ============ */
@media print{
  .topbar,.sidebar,.chapter-nav,.toc,.copy-btn,.overlay,#toTop,.progress,.search-results,.hero-deco{display:none!important}
  .main{margin:0;padding:0}
  .reader{border:0;box-shadow:none;padding:0}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="目录">☰</button>
  <a class="brand" id="brandHome" href="#" aria-label="返回首页">
    <div class="mark">原</div>
    <div class="brand-text">异能原理学文库 <small>DIGITAL LIBRARY</small></div>
  </a>
  <div class="searchbox">
    <span class="search-icon">⌕</span>
    <input id="search" type="search" placeholder="搜索书籍或章节…" autocomplete="off" aria-label="搜索">
    <span class="search-kbd">/</span>
  </div>
  <div class="actions">
    <a class="icon-btn desktop-only" id="repoBtn" target="_blank" rel="noopener" title="GitHub 仓库">
      <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>仓库</span>
    </a>
    <button class="icon-btn desktop-only" id="fontMinus" title="减小字号">A−</button>
    <button class="icon-btn desktop-only" id="fontPlus" title="增大字号">A＋</button>
    <button class="icon-btn" id="themeBtn" title="切换深色模式" aria-label="切换深色模式">
      <svg id="themeIcon" viewBox="0 0 16 16" style="width:15px;height:15px"><path d="M6 1h4v2h2v2h2v6h-2v2h-2v2H6v-2H4v-2H2V5h2V3h2V1zm1 3v8h2v-2h2V6H9V4H7z"/></svg>
    </button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="side-title">书库目录</div>
  <div id="bookList" class="book-list"><div class="loading">正在读取书库…</div></div>
  <div class="side-note">
    <b>添加新书</b><br>
    在 GitHub 的 <code>books/</code> 中新建一个文件夹，把每一章保存为 <code>.md</code> 文件。Vercel 部署后会自动显示。
  </div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <section id="homeView">
    <div class="hero">
      <div class="hero-deco" aria-hidden="true">
        <div class="deco-seal">原</div>
        <div class="deco-vertical">異能原理學文庫</div>
      </div>
      <div class="eyebrow">DIGITAL LIBRARY · GITHUB POWERED</div>
      <h1>异能<em>原理学</em>文库</h1>
      <p class="hero-desc">以 GitHub 为书库、Vercel 为出版平台的个人数字文库。浏览目录、搜索章节，即刻进入沉浸式的在线阅读。</p>
      <div class="stats">
        <div class="stat"><strong id="bookCount">—</strong><span>收录书籍</span></div>
        <div class="stat"><strong id="chapterCount">—</strong><span>章节总数</span></div>
        <div class="stat"><strong style="font-size:15px;line-height:2">Markdown</strong><span>全文格式</span></div>
      </div>
      <div class="continue hidden" id="continue"></div>
    </div>
    <div id="cards" class="cards">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>

  <section id="readerView" class="reader-shell hidden">
    <div class="breadcrumb" id="breadcrumb"></div>
    <article class="reader" id="reader"><div class="loading">正在打开章节…</div></article>
    <div class="chapter-nav" id="chapterNav"></div>
  </section>
</main>

<div class="search-results" id="searchResults" role="listbox"></div>
<button id="toTop" aria-label="回到顶部" title="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 3 3 8l1.4 1.4L7 6.8V13h2V6.8l2.6 2.6L13 8 8 3z"/></svg></button>

<script>
"use strict";

/* ================= 配置 ================= */
const CONFIG={
  owner:"zakukana",
  repo:"yynylx-docs",
  branch:"main",
  booksDir:"books"
};

const state={
  books:[],
  currentBook:null,
  currentChapter:null,
  cache:new Map(),
  fontSize:Number(localStorage.getItem("reader-font-size"))||18,
  sIdx:-1
};

const $=s=>document.querySelector(s);
const bookList=$("#bookList"),cards=$("#cards"),reader=$("#reader"),
      readerView=$("#readerView"),homeView=$("#homeView"),
      chapterNav=$("#chapterNav"),search=$("#search"),searchResults=$("#searchResults"),
      sidebar=$("#sidebar");

/* ================= 工具 ================= */
function apiUrl(path=""){
  return "https://api.github.com/repos/"+CONFIG.owner+"/"+CONFIG.repo+"/contents/"+path+
    "?ref="+encodeURIComponent(CONFIG.branch);
}
function rawUrl(path){
  return "https://raw.githubusercontent.com/"+CONFIG.owner+"/"+CONFIG.repo+"/"+CONFIG.branch+"/"+
    path.split("/").map(encodeURIComponent).join("/");
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fileName(path){return path.split("/").pop().replace(/\.md$/i,"")}
async function github(path){
  const r=await fetch(apiUrl(path),{headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error("GitHub API "+r.status);
  return r.json();
}

/* ================= 主题 ================= */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem("reader-theme",t);
  const p=$("#themeIcon").querySelector("path");
  p.setAttribute("d",t==="dark"
    ?"M8 13a5 5 0 0 0 5-5 5 5 0 0 0-5-5v10zM8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1z"
    :"M6 1h4v2h2v2h2v6h-2v2h-2v2H6v-2H4v-2H2V5h2V3h2V1zm1 3v8h2v-2h2V6H9V4H7z");
}
applyTheme(localStorage.getItem("reader-theme")||"light");
$("#themeBtn").onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* ================= 书库扫描 ================= */
async function scanBooks(){
  bookList.innerHTML='<div class="loading">正在读取书库…</div>';
  try{
    const root=await github(CONFIG.booksDir);
    const dirs=Array.isArray(root)?root.filter(x=>x.type==="dir"):[];
    const books=[];
    for(const dir of dirs){
      let items=[];
      try{items=await github(dir.path)}catch(e){continue}
      const chapters=items.filter(x=>x.type==="file"&&/\.md$/i.test(x.name))
        .sort((a,b)=>a.name.localeCompare(b.name,"zh-CN",{numeric:true}))
        .map((x,i)=>({name:fileName(x.name),path:x.path,index:i}));
      if(chapters.length)books.push({name:dir.name,path:dir.path,chapters});
    }
    state.books=books;
    renderSidebar();renderCards();renderContinue();
    $("#bookCount").textContent=books.length;
    $("#chapterCount").textContent=books.reduce((n,b)=>n+b.chapters.length,0);
    loadHash();
  }catch(e){
    bookList.innerHTML='<div class="error">暂时无法读取书库。<br>请确认仓库公开，并存在 <code>books/</code> 目录。</div>';
    cards.innerHTML='<div class="error" style="grid-column:1/-1">读取 GitHub 目录失败：'+esc(e.message)+
      '<br><button class="retry-btn" onclick="scanBooks()">重新加载</button></div>';
  }
}

/* ================= 侧边目录 ================= */
function renderSidebar(){
  if(!state.books.length){
    bookList.innerHTML='<div class="loading">书库暂为空。<br>请在 GitHub → <code>books/</code> 下添加书籍。</div>';
    return;
  }
  bookList.innerHTML=state.books.map((b,bi)=>`
    <div class="book-block">
      <button class="book-item ${state.currentBook===bi?"active":""}" data-book="${bi}">
        <span>${esc(b.name)}</span><span class="book-count">${b.chapters.length} 章</span>
      </button>
      <div class="chapter-list">
        ${b.chapters.map((c,ci)=>`
          <button class="chapter-item ${state.currentBook===bi&&state.currentChapter===ci?"active":""}"
            data-book="${bi}" data-chapter="${ci}">${esc(c.name)}</button>`).join("")}
      </div>
    </div>`).join("");
  bookList.querySelectorAll(".book-item").forEach(x=>x.onclick=()=>openBook(+x.dataset.book));
  bookList.querySelectorAll(".chapter-item").forEach(x=>x.onclick=()=>openChapter(+x.dataset.book,+x.dataset.chapter));
  const act=bookList.querySelector(".chapter-item.active");
  if(act){requestAnimationFrame(()=>{try{sidebar.scrollTop=act.offsetTop-sidebar.clientHeight/2+40}catch(e){}})}
}

/* ================= 首页卡片 ================= */
function renderCards(){
  if(!state.books.length){cards.innerHTML="";return}
  cards.innerHTML=state.books.map((b,i)=>`
    <div class="card">
      <div class="card-top">
        <span class="card-no">BOOK ${String(i+1).padStart(2,"0")}</span>
        <span class="card-badge">${b.chapters.length} 个章节</span>
      </div>
      <h2>${esc(b.name)}</h2>
      <ul class="card-preview">
        ${b.chapters.slice(0,3).map(c=>"<li>"+esc(c.name)+"</li>").join("")}
        ${b.chapters.length>3?'<li style="color:var(--line-2)">…</li>':""}
      </ul>
      <div class="card-foot">
        <span class="card-meta">Markdown · 在线阅读</span>
        <button class="open-btn" data-open="${i}">进入阅读 <span>→</span></button>
      </div>
    </div>`).join("");
  cards.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openBook(+x.dataset.open));
}

/* ================= 继续阅读 ================= */
function renderContinue(){
  const el=$("#continue");
  try{
    const last=JSON.parse(localStorage.getItem("reader-last")||"null");
    if(last&&last.bp&&last.cp){
      el.innerHTML='<button class="continue-btn" id="continueBtn"><span class="continue-tag">继续阅读</span>'+
        '<span class="continue-main"><span class="continue-title">'+esc(last.title)+'</span>'+
        '<span class="continue-book">'+esc(last.book)+'</span></span><span class="continue-arrow">→</span></button>';
      el.classList.remove("hidden");
      $("#continueBtn").onclick=()=>{
        const bi=state.books.findIndex(b=>b.path===last.bp);
        if(bi<0)return;
        const ci=state.books[bi].chapters.findIndex(c=>c.path===last.cp);
        if(ci>=0)openChapter(bi,ci);
      };
      return;
    }
  }catch(e){}
  el.classList.add("hidden");
}

/* ================= 视图切换 ================= */
function showHome(){
  homeView.classList.remove("hidden");readerView.classList.add("hidden");
  document.title="异能原理学文库";
}
function openBook(bi){
  if(!state.books[bi])return;
  state.currentBook=bi;state.currentChapter=null;
  showHome();renderSidebar();
  document.title=state.books[bi].name+" · 异能原理学文库";
  closeMobile();
}

/* ================= 章节阅读 ================= */
async function openChapter(bi,ci,setHash=true){
  const b=state.books[bi],c=b&&b.chapters[ci];if(!c)return;
  state.currentBook=bi;state.currentChapter=ci;
  homeView.classList.add("hidden");readerView.classList.remove("hidden");
  $("#breadcrumb").innerHTML='<a data-go="home">文库</a><span class="sep">/</span>'+
    '<a data-go="book">'+esc(b.name)+'</a><span class="sep">/</span><span>'+esc(c.name)+'</span>';
  $("#breadcrumb").querySelector('[data-go="home"]').onclick=showHome;
  $("#breadcrumb").querySelector('[data-go="book"]').onclick=()=>openBook(bi);
  reader.innerHTML='<div class="loading">正在加载《'+esc(c.name)+'》…</div>';
  renderSidebar();closeMobile();
  if(setHash)location.hash="book="+encodeURIComponent(b.path)+"&chapter="+encodeURIComponent(c.path);
  try{
    let md=state.cache.get(c.path);
    if(!md){
      const r=await fetch(rawUrl(c.path));
      if(!r.ok)throw new Error("章节读取失败（"+r.status+"）");
      md=await r.text();state.cache.set(c.path,md);
    }
    reader.innerHTML=markdown(md);
    enhanceReader();
    renderNav();
    document.title=c.name+" · "+b.name;
    try{localStorage.setItem("reader-last",JSON.stringify({bp:b.path,cp:c.path,title:c.name,book:b.name}))}catch(e){}
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    reader.innerHTML='<div class="error">无法读取本章节。<br>'+esc(e.message)+'</div>';
  }
}

function enhanceReader(){
  /* 章内目录 */
  const h2s=[...reader.querySelectorAll("h2")];
  if(h2s.length>=3){
    h2s.forEach((h,i)=>{if(!h.id)h.id="sec-"+i});
    const toc=document.createElement("nav");
    toc.className="toc";
    toc.innerHTML='<div class="toc-title">本节目录 · CONTENTS</div>'+
      h2s.map(h=>'<a data-target="'+h.id+'">'+esc(h.textContent)+"</a>").join("");
    const h1=reader.querySelector("h1");
    h1?h1.parentNode.insertBefore(toc,h1.nextSibling):reader.prepend(toc);
    toc.querySelectorAll("[data-target]").forEach(a=>a.onclick=()=>{
      const t=reader.querySelector("#"+a.dataset.target);
      if(t)t.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }
  /* 代码复制 */
  reader.querySelectorAll("pre").forEach(pre=>{
    const btn=document.createElement("button");
    btn.className="copy-btn";btn.textContent="复制";btn.type="button";
    btn.onclick=()=>{
      navigator.clipboard&&navigator.clipboard.writeText(pre.querySelector("code")?pre.querySelector("code").innerText:pre.innerText)
        .then(()=>{btn.textContent="已复制 ✓";setTimeout(()=>btn.textContent="复制",1600)})
        .catch(()=>{btn.textContent="失败";setTimeout(()=>btn.textContent="复制",1600)});
    };
    pre.appendChild(btn);
  });
  /* 阅读时长 */
  const text=reader.textContent||"";
  const cjk=(text.match(/[\u4e00-\u9fff]/g)||[]).length;
  const words=(text.match(/[A-Za-z0-9]+/g)||[]).length;
  const mins=Math.max(1,Math.round((cjk+words)/450));
  const h1=reader.querySelector("h1");
  if(h1){
    const meta=document.createElement("div");
    meta.className="reader-meta";
    meta.innerHTML="<span>全文约 "+(cjk+words).toLocaleString()+" 字</span><span class='dot'></span><span>约 "+mins+" 分钟读完</span>";
    h1.parentNode.insertBefore(meta,h1.nextSibling);
  }
}

function renderNav(){
  const b=state.books[state.currentBook],i=state.currentChapter;
  const p=b.chapters[i-1],n=b.chapters[i+1];
  chapterNav.innerHTML=
    (p?'<button class="nav-btn" id="prev"><small>← 上一章</small><div class="nav-name">'+esc(p.name)+"</div></button>":"<div></div>")+
    (n?'<button class="nav-btn next" id="next"><small>下一章 →</small><div class="nav-name">'+esc(n.name)+"</div></button>":"<div></div>");
  if(p)$("#prev").onclick=()=>openChapter(state.currentBook,i-1);
  if(n)$("#next").onclick=()=>openChapter(state.currentBook,i+1);
}

/* ================= Markdown 渲染 ================= */
function safeUrl(u){
  try{
    const x=new URL(u,location.href);
    if(["javascript:","data:","vbscript:"].includes(x.protocol))return "#";
    return esc(x.href);
  }catch{return "#"}
}
function inline(s){
  let x=esc(s);
  x=x.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(m,a,u,t)=>'<img src="'+safeUrl(u)+'" alt="'+a+'"'+(t?' title="'+t+'"':'')+'>');
  x=x.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,u)=>'<a href="'+safeUrl(u)+'" target="_blank" rel="noopener">'+a+"</a>");
  x=x.replace(/`([^`]+)`/g,"<code>$1</code>");
  x=x.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  x=x.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  x=x.replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/_([^_]+)_/g,"<em>$1</em>");
  return x;
}
function markdown(md){
  md=md.replace(/\r\n?/g,"\n");
  const l=md.split("\n"),o=[];let i=0,code=false,buf=[];
  while(i<l.length){
    const line=l[i];
    if(/^```/.test(line)){
      if(!code){code=true;buf=[]}else{o.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");code=false}
      i++;continue;
    }
    if(code){buf.push(line);i++;continue}
    if(!line.trim()){i++;continue}
    if(/^---+\s*$/.test(line)){o.push("<hr>");i++;continue}
    let m=line.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);
    if(m){o.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">");i++;continue}
    if(/^>\s?/.test(line)){
      const q=[];while(i<l.length&&/^>\s?/.test(l[i])){q.push(l[i].replace(/^>\s?/,""));i++}
      o.push("<blockquote>"+q.map(inline).join("<br>")+"</blockquote>");continue;
    }
    if(/^\s*[-*+]\s+/.test(line)){
      const a=[];while(i<l.length&&/^\s*[-*+]\s+/.test(l[i])){a.push(l[i].replace(/^\s*[-*+]\s+/,""));i++}
      o.push("<ul>"+a.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      const a=[];while(i<l.length&&/^\s*\d+[.)]\s+/.test(l[i])){a.push(l[i].replace(/^\s*\d+[.)]\s+/,""));i++}
      o.push("<ol>"+a.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");continue;
    }
    if(line.includes("|")&&i+1<l.length&&/^\s*\|?\s*:?-{2,}/.test(l[i+1])){
      const cells=s=>s.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
      const head=cells(line);i+=2;const rows=[];
      while(i<l.length&&l[i].includes("|")){rows.push(cells(l[i]));i++}
      o.push("<table><thead><tr>"+head.map(x=>"<th>"+inline(x)+"</th>").join("")+
        "</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+inline(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      continue;
    }
    const p=[line.trim()];i++;
    while(i<l.length&&l[i].trim()&&!/^(#{1,4})\s|^>\s?|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^```|^---+\s*$/.test(l[i])){
      p.push(l[i].trim());i++;
    }
    o.push("<p>"+inline(p.join("\n").replace(/\n/g,"<br>"))+"</p>");
  }
  return o.join("");
}

/* ================= 路由 ================= */
function loadHash(){
  if(!location.hash.startsWith("#book="))return;
  const p=new URLSearchParams(location.hash.slice(1));
  const bi=state.books.findIndex(b=>b.path===p.get("book"));
  if(bi<0)return;
  const ci=state.books[bi].chapters.findIndex(c=>c.path===p.get("chapter"));
  if(ci>=0)openChapter(bi,ci,false);
}

/* ================= 搜索 ================= */
async function doSearch(q){
  state.sIdx=-1;
  q=q.trim().toLowerCase();
  if(!q){searchResults.classList.remove("show");return}
  const rs=[];
  state.books.forEach((b,bi)=>{
    if(b.name.toLowerCase().includes(q))rs.push({bi,ci:null,title:b.name,sub:b.chapters.length+" 个章节",kind:"书籍"});
    b.chapters.forEach((c,ci)=>{
      if(c.name.toLowerCase().includes(q)&&rs.length<30)rs.push({bi,ci,title:c.name,sub:b.name,kind:"章节"});
    });
  });
  searchResults.innerHTML=rs.length?rs.map((r,i)=>'<button class="result" role="option" data-r="'+i+'">'+
    '<span class="r-kind">'+r.kind+'</span><b>'+esc(r.title)+'</b><span class="r-sub">'+esc(r.sub)+"</span></button>").join(""):
    '<div class="no-results">没有找到匹配的书籍或章节</div>';
  searchResults.classList.add("show");
  searchResults.querySelectorAll("[data-r]").forEach((x,i)=>x.onclick=()=>{
    const r=rs[i];
    r.ci===null?openBook(r.bi):openChapter(r.bi,r.ci);
    search.value="";searchResults.classList.remove("show");
  });
}
search.addEventListener("input",()=>doSearch(search.value));
search.addEventListener("keydown",e=>{
  const items=[...searchResults.querySelectorAll(".result")];
  if(e.key==="Escape"){searchResults.classList.remove("show");search.blur();return}
  if(!items.length)return;
  if(e.key==="ArrowDown"){e.preventDefault();state.sIdx=(state.sIdx+1)%items.length}
  else if(e.key==="ArrowUp"){e.preventDefault();state.sIdx=(state.sIdx-1+items.length)%items.length}
  else if(e.key==="Enter"){e.preventDefault();if(state.sIdx>=0)items[state.sIdx].click();return}
  else return;
  items.forEach((x,i)=>x.classList.toggle("sel",i===state.sIdx));
  items[state.sIdx].scrollIntoView({block:"nearest"});
});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault();search.focus();
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".searchbox")&&!e.target.closest(".search-results"))searchResults.classList.remove("show");
});

/* ================= 全局 UI ================= */
function closeMobile(){sidebar.classList.remove("open");$("#overlay").classList.remove("show")}
$("#menuBtn").onclick=()=>{sidebar.classList.toggle("open");$("#overlay").classList.toggle("show")};
$("#overlay").onclick=closeMobile;
$("#brandHome").onclick=e=>{e.preventDefault();state.currentBook=null;state.currentChapter=null;showHome();renderSidebar()};
$("#repoBtn").href="https://github.com/"+CONFIG.owner+"/"+CONFIG.repo;
$("#fontMinus").onclick=()=>{state.fontSize=Math.max(15,state.fontSize-1);document.documentElement.style.setProperty("--font-size",state.fontSize+"px");localStorage.setItem("reader-font-size",state.fontSize)};
$("#fontPlus").onclick=()=>{state.fontSize=Math.min(24,state.fontSize+1);document.documentElement.style.setProperty("--font-size",state.fontSize+"px");localStorage.setItem("reader-font-size",state.fontSize)};
document.documentElement.style.setProperty("--font-size",state.fontSize+"px");

const toTop=$("#toTop");
toTop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  $("#progress").style.width=(h>0?scrollY/h*100:0)+"%";
  toTop.classList.toggle("show",scrollY>600);
},{passive:true});
window.addEventListener("hashchange",loadHash);

scanBooks();
</script>
</body>
</html>
